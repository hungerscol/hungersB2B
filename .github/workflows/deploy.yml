
name: Desplegar Hungers en Firebase
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: npm install

      - name: Construir proyecto (Build)
        run: npm run build
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_FIREBASE_API_KEY: "AIzaSyBOC3-OpJRB2BZTpyKiQYwWf9_M3GacSFk"
          VITE_FIREBASE_AUTH_DOMAIN: "gen-lang-client-0214596384.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "gen-lang-client-0214596384"
          VITE_FIREBASE_STORAGE_BUCKET: "gen-lang-client-0214596384.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1052854456789"
          VITE_FIREBASE_APP_ID: "1:1052854456789:web:7e5289f9225a008d3f2d5c"

      - name: Subir a Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: gen-lang-client-0214596384
          channelId: live
